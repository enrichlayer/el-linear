allowBuilds:
  esbuild: true
# Defense-in-depth against fast-yank supply-chain attacks: pnpm refuses
# to install any package version younger than this many minutes. This
# protects `pnpm install` / `pnpm update` runs even when dependabot
# isn't in the loop. 10080 = 7 * 24 * 60 (7 days).
#
# Matches the dependabot `cooldown.default-days: 7` in
# .github/dependabot.yml. Bump both together if you change the policy.
minimumReleaseAge: 10080

# The @sentry/node 10.68.0 bump transitively pulls in
# @apm-js-collab/code-transformer-bundler-plugins@0.7.1, whose
# dist/cjs/core.d.cts imports './instrumentation-serde' but the package
# does not ship that file under its exports map. Inline the declarations
# via a patch so tsc does not fail with TS2307.
patchedDependencies:
  '@apm-js-collab/code-transformer-bundler-plugins@0.7.1': patches/@apm-js-collab__code-transformer-bundler-plugins@0.7.1.patch
